<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricomm</title>
    <style>
        :root {
            --paper: #faf9f5;
            --green: #2e7d32;
            --green-dark: #1f5e24;
            --blue: #1d4f91;
            --blue-dark: #153b6e;
            --ink: #1b2a3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .logo {
            width: min(480px, 90%);
            height: auto;
            /* blends the logo's off-white background into the page */
            mix-blend-mode: multiply;
        }

        .prompt {
            font-size: 1.15rem;
            margin: 8px 0 28px;
            text-align: center;
        }

        .tiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            width: min(760px, 100%);
        }

        .tile {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 32px 28px;
            border-radius: 18px;
            color: #fff;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .tile-buy  { background: var(--green); }
        .tile-sell { background: var(--blue); }

        .tile-buy:hover,
        .tile-buy:focus-visible  { background: var(--green-dark); transform: translateY(-4px); }
        .tile-sell:hover,
        .tile-sell:focus-visible { background: var(--blue-dark);  transform: translateY(-4px); }

        .tile:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        .tile svg {
            width: 44px;
            height: 44px;
            stroke: #fff;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tile h2 {
            font-size: 1.7rem;
        }

        .tile p {
            font-size: 1rem;
            line-height: 1.45;
            opacity: 0.92;
        }

        @media (max-width: 600px) {
            .tiles {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .tile { transition: none; }
            .tile:hover, .tile:focus-visible { transform: none; }
        }
    </style>
</head>
